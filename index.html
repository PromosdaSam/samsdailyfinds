<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sam's Daily Finds — Top Products of the Day</title>
  <meta name="description" content="Smart curation of the best deals on Amazon and more. Updated in real time — click and save!">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta http-equiv="X-Content-Type-Options" content="nosniff">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https://images-na.ssl-images-amazon.com https://m.media-amazon.com https://videos.samsdailyfinds.com; media-src 'self' blob: https://videos.samsdailyfinds.com; font-src 'self' https://fonts.gstatic.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests;">
  <meta property="og:title" content="🔥 Sam's Daily Finds — Top Products of the Day">
  <meta property="og:description" content="Smart curation of the best deals — click a product and grab yours!">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://samsdailyfinds.com/">
  <meta property="og:locale" content="en_US">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔥</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg:          #f3f1ed;
      --bg-2:        #ebe8e2;
      --card:        #ffffff;
      --ink:         #17140f;
      --ink-soft:    #6b665e;
      --ink-faint:   #a39d92;
      --border:      #17140f;
      --border-soft: #ddd8cf;
      --accent:      #ff6b4a;
      --accent-soft: #fff1ec;
      --check:       #1d9bf0;
      --radius-card: 18px;
      --radius-pill: 100px;
      --shadow:      0 2px 14px rgba(20,20,15,0.06);
      --shadow-hov:  0 10px 28px rgba(20,20,15,0.12);
    }

    html { scroll-behavior: smooth; }

    body {
      font-family: 'Quicksand', 'Segoe UI', system-ui, sans-serif;
      background: var(--bg);
      color: var(--ink);
      min-height: 100vh;
      line-height: 1.5;
      font-weight: 500;
    }

    /* ── Hero (bio-link style: banner + overlapping avatar) ── */
    .hero { position: relative; }

    .hero-banner {
      width: 100%;
      height: clamp(160px, 32vw, 300px);
      object-fit: cover;
      display: block;
      border-bottom-left-radius: 42px;
      border-bottom-right-radius: 42px;
    }

    .theme-toggle {
      position: absolute;
      top: 16px;
      right: 20px;
      background: rgba(255,255,255,0.85);
      border: none;
      color: var(--ink);
      border-radius: 50%;
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 1.25rem;
      line-height: 1;
      box-shadow: var(--shadow);
    }
    .theme-toggle:hover { background: #fff; }

    .hero-content {
      background: var(--bg);
      text-align: center;
      padding: 0 20px 40px;
    }

    .hero-avatar {
      width: clamp(96px, 22vw, 128px);
      height: clamp(96px, 22vw, 128px);
      border-radius: 50%;
      object-fit: cover;
      display: block;
      margin: -56px auto 16px;
      border: 4px solid var(--bg);
      box-shadow: var(--shadow-hov);
      background: var(--card);
    }

    .hero-name {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      font-size: clamp(1.3rem, 4vw, 1.65rem);
      font-weight: 700;
      color: var(--ink);
      letter-spacing: -0.2px;
    }

    .hero-name svg { width: 19px; height: 19px; flex-shrink: 0; }

    .hero-tag {
      margin-top: 6px;
      font-size: 0.9rem;
      color: var(--ink-soft);
      max-width: 380px;
      margin-inline: auto;
    }

    /* ── Social icons: rounded black badges ───────────────── */
    .social-row {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-top: 18px;
      flex-wrap: wrap;
    }

    .social-badge {
      width: 38px;
      height: 38px;
      border-radius: 12px;
      background: var(--ink);
      color: var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      flex-shrink: 0;
    }
    .social-badge:hover { background: var(--accent); }
    .social-badge svg { width: 17px; height: 17px; }

    /* ── Pill CTA ─────────────────────────────────────────── */
    .hero-ctas {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      margin-top: 26px;
    }

    .pill-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 14px 28px;
      border-radius: var(--radius-pill);
      border: 2px solid var(--border);
      background: transparent;
      color: var(--ink);
      font-family: inherit;
      font-size: 0.92rem;
      font-weight: 600;
      text-decoration: none;
      white-space: nowrap;
    }
    .pill-btn:hover { background: var(--ink); color: var(--bg); }
    .pill-btn svg { width: 18px; height: 18px; flex-shrink: 0; }

    .pill-btn.filled { background: var(--ink); color: var(--bg); }
    .pill-btn.filled:hover { background: var(--accent); border-color: var(--accent); color: #fff; }

    /* ── Controls ─────────────────────────────────────── */
    .controls {
      max-width: 1100px;
      margin: 0 auto;
      padding: 8px 20px 0;
    }

    .search-wrap {
      position: relative;
      max-width: 540px;
      margin: 0 auto 20px;
    }

    .search-wrap .search-icon {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      width: 17px;
      height: 17px;
      color: var(--ink-faint);
      pointer-events: none;
    }

    #search {
      width: 100%;
      padding: 13px 20px 13px 44px;
      border: 2px solid var(--border);
      border-radius: var(--radius-pill);
      font-family: inherit;
      font-size: 0.95rem;
      font-weight: 500;
      background: var(--card);
      color: var(--ink);
      outline: none;
    }

    #search:focus { box-shadow: 0 0 0 3px rgba(23,20,15,0.1); }
    #search::placeholder { color: var(--ink-faint); }

    .cats {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
      padding-bottom: 24px;
    }

    .cat-btn {
      padding: 8px 16px;
      border-radius: var(--radius-pill);
      border: 2px solid var(--border);
      background: var(--card);
      color: var(--ink);
      font-family: inherit;
      font-size: 0.84rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }

    .cat-btn:hover { background: var(--bg-2); }
    .cat-btn.active { background: var(--ink); border-color: var(--ink); color: var(--bg); }

    /* ── Grid ─────────────────────────────────────────── */
    .grid {
      max-width: 1100px;
      margin: 0 auto;
      padding: 0 20px 60px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 16px;
    }

    .empty {
      text-align: center;
      padding: 64px 20px;
      color: var(--ink-soft);
      display: none;
    }
    .empty span { font-size: 3rem; display: block; margin-bottom: 12px; }

    /* ── Product card ─────────────────────────────────── */
    .product-card {
      background: var(--card);
      border: 1.5px solid var(--border-soft);
      border-radius: var(--radius-card);
      overflow: hidden;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
    }
    .product-card:hover { box-shadow: var(--shadow-hov); border-color: var(--ink); }

    .card-link { display: flex; flex-direction: column; flex: 1; text-decoration: none; color: inherit; }

    .card-media {
      aspect-ratio: 9/16;
      background: var(--bg-2);
      overflow: hidden;
      position: relative;
      flex-shrink: 0;
    }

    .card-media video { width: 100%; height: 100%; object-fit: cover; display: block; }

    .placeholder-media {
      width: 100%; height: 100%; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 8px; color: var(--ink-soft);
    }
    .placeholder-media span { font-size: 3rem; }
    .placeholder-media small { font-size: 0.65rem; font-weight: 600; letter-spacing: 0.4px; text-transform: uppercase; }

    .play-icon {
      position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      background: rgba(23,20,15,0.06); opacity: 0; transition: opacity 0.2s;
    }
    .card-media.has-video:hover .play-icon { opacity: 1; }
    .card-media.has-video { cursor: pointer; }

    .video-tooltip {
      position: absolute; inset: 0;
      display: flex; align-items: flex-end; justify-content: center;
      padding-bottom: 14px; opacity: 0; transition: opacity 0.2s;
      pointer-events: none; z-index: 3;
    }
    .card-media.has-video:hover .video-tooltip { opacity: 1; }
    .video-tooltip span {
      background: var(--ink); color: var(--bg);
      font-size: 0.68rem; font-weight: 600; letter-spacing: 0.2px;
      padding: 5px 10px; border-radius: 999px;
    }

    @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
    .card-media::before {
      content: ''; position: absolute; inset: 0;
      background: linear-gradient(90deg, transparent 25%, rgba(255,255,255,0.5) 50%, transparent 75%);
      background-size: 200% 100%; animation: shimmer 1.4s ease-in-out infinite;
      z-index: 1; pointer-events: none; transition: opacity 0.35s;
    }
    .card-media.media-loaded::before { opacity: 0; animation: none; }

    .card-media img, .card-media video { opacity: 0; transition: opacity 0.45s; position: relative; z-index: 2; }
    .card-media img.loaded, .card-media video.loaded { opacity: 1; }

    .play-icon svg { width: 42px; height: 42px; fill: rgba(255,255,255,0.92); filter: drop-shadow(0 2px 8px rgba(0,0,0,0.28)); }

    .card-body { padding: 11px 12px 13px; display: flex; flex-direction: column; gap: 5px; flex: 1; }

    .card-cat { font-size: 0.66rem; font-weight: 700; color: var(--ink-faint); text-transform: uppercase; letter-spacing: 0.5px; }

    .card-name {
      font-size: 0.86rem; font-weight: 600; color: var(--ink); line-height: 1.35;
      display: -webkit-box; -webkit-line-clamp: 2; line-clamp: 2;
      -webkit-box-orient: vertical; overflow: hidden; min-height: 2.7em;
    }

    .card-cta {
      display: block; text-align: center; margin-top: 6px; padding: 8px;
      border-radius: 10px; background: var(--accent-soft); color: var(--accent);
      font-size: 0.78rem; font-weight: 700;
    }
    .product-card:hover .card-cta { background: var(--ink); color: var(--bg); }

    /* ── Footer ───────────────────────────────────────── */
    footer { background: var(--ink); color: rgba(243,241,237,0.72); text-align: center; padding: 26px 20px; font-size: 0.82rem; }
    footer a { color: rgba(243,241,237,0.92); text-decoration: none; }
    footer a:hover { color: #fff; text-decoration: underline; }
    footer .footer-links { display: flex; justify-content: center; gap: 16px; margin-bottom: 8px; flex-wrap: wrap; }

    /* ── Dark mode ────────────────────────────────────── */
    [data-theme="dark"] {
      --bg:          #17140f;
      --bg-2:        #221e17;
      --card:        #221e17;
      --ink:         #f3f1ed;
      --ink-soft:    #b4ac9d;
      --ink-faint:   #756e60;
      --border:      #f3f1ed;
      --border-soft: #3a352b;
      --accent-soft: rgba(255,107,74,0.14);
    }
    [data-theme="dark"] footer { background: #0e0c08; }
    [data-theme="dark"] .theme-toggle { background: rgba(34,30,23,0.85); color: var(--ink); }
    [data-theme="dark"] .theme-toggle:hover { background: #221e17; }

    body { transition: background 0.25s, color 0.25s; }

    /* ── Newest ────────────────────────────────────────── */
    .novidades-section { max-width: 1100px; margin: 0 auto; padding: 32px 20px 8px; }
    .novidades-label {
      display: flex; align-items: center; gap: 12px; font-size: 1.05rem; font-weight: 700;
      color: var(--ink); margin-bottom: 16px; text-transform: uppercase; letter-spacing: 0.6px;
    }
    .novidades-label::after { content: ''; flex: 1; height: 2px; background: var(--border-soft); border-radius: 2px; }

    .novidades-strip {
      display: flex; justify-content: flex-start; gap: 14px; overflow-x: auto;
      padding-bottom: 12px; scroll-snap-type: x mandatory; -webkit-overflow-scrolling: touch;
    }
    .novidades-strip::-webkit-scrollbar { height: 4px; }
    .novidades-strip::-webkit-scrollbar-track { background: var(--border-soft); border-radius: 4px; }
    .novidades-strip::-webkit-scrollbar-thumb { background: var(--ink-faint); border-radius: 4px; }
    .novidades-strip .product-card { min-width: 160px; max-width: 190px; flex-shrink: 0; scroll-snap-align: start; }

    /* ── Responsive ───────────────────────────────────── */
    @media (max-width: 600px) {
      .grid { grid-template-columns: repeat(2, 1fr); gap: 11px; padding-inline: 12px; }
      .card-body { padding: 9px 10px 11px; }
      .hero-ctas { gap: 8px; }
    }

    .result-count {
      text-align: center;
      font-size: 0.78rem;
      color: var(--ink-faint);
      padding-bottom: 12px;
      font-weight: 600;
    }

    .load-more-wrap {
      display: none;
      justify-content: center;
      padding: 28px 0 40px;
    }
    .load-more-btn {
      background: transparent;
      color: var(--ink);
      border: 2px solid var(--border);
      border-radius: var(--radius-pill);
      padding: 13px 36px;
      font-family: inherit;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      letter-spacing: 0.3px;
      transition: background 0.15s, color 0.15s, transform 0.15s;
    }
    .load-more-btn:hover { background: var(--ink); color: var(--bg); transform: translateY(-1px); }

    /* ── Modal popup (multi-product) ─────────────────── */
    #modal-overlay {
      position: fixed; inset: 0; background: rgba(23,20,15,0.65); z-index: 1000;
      display: none; align-items: center; justify-content: center; padding: 16px;
    }
    #modal-overlay.open { display: flex; }

    .modal-box {
      background: var(--card);
      border: 1.5px solid var(--border-soft);
      border-radius: 20px;
      max-width: 380px;
      width: 100%;
      max-height: 88vh;
      overflow-y: auto;
      position: relative;
      box-shadow: 0 24px 64px rgba(0,0,0,0.25);
    }

    .modal-close {
      position: absolute; top: 10px; right: 10px;
      background: rgba(23,20,15,0.14); border: none; color: var(--ink);
      width: 30px; height: 30px; border-radius: 50%; font-size: 0.95rem;
      cursor: pointer; z-index: 10; line-height: 1;
    }

    .modal-body { padding: 20px 16px 20px; }

    .modal-title { font-size: 0.9rem; font-weight: 700; color: var(--ink); margin-bottom: 12px; line-height: 1.3; }

    .modal-label {
      font-size: 0.65rem; font-weight: 700; color: var(--ink-faint);
      text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px;
    }

    .modal-products { display: flex; flex-direction: column; gap: 7px; }

    /* ── Video popup ──────────────────────────────────── */
    #video-modal-overlay {
      position: fixed; inset: 0; background: rgba(23,20,15,0.82); z-index: 1000;
      display: none; align-items: center; justify-content: center; padding: 16px;
    }
    #video-modal-overlay.open { display: flex; }

    .video-modal-box {
      position: relative; max-width: 380px; width: 100%; max-height: 88vh;
      aspect-ratio: 9/16; border-radius: 18px; overflow: hidden;
      box-shadow: 0 24px 64px rgba(0,0,0,0.45); background: #000;
    }
    .video-modal-box video { width: 100%; height: 100%; object-fit: contain; display: block; }

    .video-modal-spinner {
      position: absolute; top: 50%; left: 50%; width: 38px; height: 38px;
      margin: -19px 0 0 -19px; border: 4px solid rgba(255,255,255,0.25);
      border-top-color: #fff; border-radius: 50%; display: none;
      animation: spin 0.8s linear infinite; z-index: 5; pointer-events: none;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .card-cta-multi {
      display: block; text-align: center; padding: 9px 12px; border-radius: 10px;
      background: var(--accent-soft); color: var(--accent);
      font-size: 0.82rem; font-weight: 700; text-decoration: none;
      transition: background 0.15s, color 0.15s;
    }
    .card-cta-multi:hover { background: var(--ink); color: var(--bg); }
  </style>
</head>

    <img src="banner.jpg" class="hero-banner" alt="">
    <button class="theme-toggle" id="theme-toggle" aria-label="Toggle dark/light mode">🌙</button>

      </div>

      <div class="hero-ctas">

  </header>

  <!-- Newest -->
  <section class="novidades-section" id="novidades-section" aria-label="Newest" style="display:none">
    <h2 class="novidades-label">Newest Products</h2>
    <div class="novidades-strip" id="novidades-strip"></div>
  </section>

  <!-- Search and filters -->
  <section class="controls" id="deals" aria-label="Filters and search">
    <div class="search-wrap">
      <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
      </svg>
      <input type="search" id="search" placeholder="Search products..." aria-label="Search products" autocomplete="off">
    </div>
    <div class="cats" id="cats" role="group" aria-label="Categories"></div>
    <p class="result-count" id="result-count"></p>
  </section>

  <!-- Product grid -->
  <main>
    <div class="grid" id="grid" aria-live="polite" aria-label="Products"></div>
    <div class="empty" id="empty">
      <span>🔍</span>
      No products found for that search.
    </div>
    <div class="load-more-wrap" id="load-more-wrap">
      <button class="load-more-btn" onclick="loadMore()">Load more deals ↓</button>
    </div>
  </main>

  <footer>
    <div class="footer-links">
      <a href="/privacy.html">Privacy Policy</a>
      <a href="/terms.html">Terms of Use</a>
    </div>
    <p>© 2026 Sam's Daily Finds · As an Amazon Associate I earn from qualifying purchases.</p>
  </footer>

  <script>
    /* ─────────────────────────────────────────────────────
       PRODUCTS — add / remove products here
       Fields:
         id       → unique identifier
         name     → product display name
         category → must match an id from CATEGORIES below
         video    → path to .mp4 file (or null)
         link     → affiliate link
    ───────────────────────────────────────────────────── */
    const PRODUCTS = [];

    const CATEGORIES = [
      { id: "all",         label: "All" },
      { id: "kitchen",     label: "Kitchen" },
      { id: "cleaning",    label: "Cleaning" },
      { id: "outdoor",     label: "Outdoor" },
      { id: "bathroom",    label: "Bathroom" },
      { id: "bedroom",     label: "Bedroom" },
      { id: "living_room", label: "Living Room" },
      { id: "electronics", label: "Electronics" },
      { id: "home",        label: "Home" },
    ];

    const CAT_LABEL = Object.fromEntries(
      CATEGORIES.filter(c => c.id !== "all").map(c => [c.id, c.label])
    );

    let activeCategory = "all";
    let searchQuery    = "";
    const PAGE_SIZE    = 24;
    let visibleCount   = PAGE_SIZE;

    function buildCategories() {
      const container = document.getElementById("cats");
      CATEGORIES.forEach(cat => {
        const btn = document.createElement("button");
        btn.className = "cat-btn" + (cat.id === "all" ? " active" : "");
        btn.textContent = cat.label;
        btn.dataset.cat = cat.id;
        btn.setAttribute("aria-pressed", cat.id === "all" ? "true" : "false");
        btn.addEventListener("click", () => {
          activeCategory = cat.id;
          visibleCount = PAGE_SIZE;
          document.querySelectorAll(".cat-btn").forEach(b => {
            b.classList.toggle("active", b.dataset.cat === cat.id);
            b.setAttribute("aria-pressed", b.dataset.cat === cat.id ? "true" : "false");
          });
          render();
        });
        container.appendChild(btn);
      });
    }

    function esc(s) {
      return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;")
                      .replace(/>/g,"&gt;").replace(/"/g,"&quot;");
    }

    function posterUrl(p) {
      if (p.video) return p.video.replace(/\.mp4(\?.*)?$/i, '_thumb.jpg');
      return null;
    }

    function cardHTML(p) {
      const catLabel = CAT_LABEL[p.category] || p.category;
      const poster = posterUrl(p);
      const fallback = p.image ? esc(p.image) : '';
      const media = poster
        ? `<img src="${esc(poster)}" ${fallback ? `onerror="this.onerror=null;this.src='${fallback}';"` : ''} loading="lazy" alt="${esc(p.name)}" class="media-img" style="width:100%;height:100%;object-fit:cover;">`
        : p.image
          ? `<img src="${esc(p.image)}" loading="lazy" alt="${esc(p.name)}" class="media-img" style="width:100%;height:100%;object-fit:cover;">`
          : `<div class="placeholder-media"><span>🔥</span><small>Click to see deal</small></div>`;

      // 2026-07-25: popup de vídeo desativado no site internacional — os
      // vídeos originais do P1 não têm áudio, então mostrar só a imagem
      // estática (poster derivado do vídeo) e nunca abrir o popup (pedido
      // explícito da usuária). posterUrl()/media acima continuam iguais —
      // só o clique-pra-vídeo é que some.
      const hasVideo = false;
      const mediaBlock = `
        <div class="card-media${hasVideo ? ' has-video' : ''}"${hasVideo ? ` onclick="openVideoModal(event, ${esc(JSON.stringify(p.video))}, ${esc(JSON.stringify(poster || p.image || ''))})"` : ''}>
          ${media}
          ${hasVideo ? `
          <div class="play-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M5 3l14 9-14 9V3z"/></svg>
          </div>
          <div class="video-tooltip" aria-hidden="true"><span>Click to see the video</span></div>` : ''}
        </div>`;

      const related = Array.isArray(p.related_products) ? p.related_products : [];

      if (related.length > 1) {
        // Compilação — card clicável abre popup com os links
        return `
          <article class="product-card" data-category="${esc(p.category)}"
                   onclick="openModal(${esc(JSON.stringify(p))})" style="cursor:pointer">
            ${mediaBlock}
            <div class="card-body">
              <span class="card-cat">${esc(catLabel)}</span>
              <h2 class="card-name">${esc(p.name)}</h2>
              <span class="card-cta">Get links →</span>
            </div>
          </article>`;
      }

      // Produto único — card inteiro clicável
      return `
        <article class="product-card" data-category="${esc(p.category)}">
          <a href="${esc(p.link)}" class="card-link"
             target="_blank" rel="noopener noreferrer sponsored"
             aria-label="${esc(p.name)} — see deal">
            ${mediaBlock}
            <div class="card-body">
              <span class="card-cat">${esc(catLabel)}</span>
              <h2 class="card-name">${esc(p.name)}</h2>
              <span class="card-cta">Get link →</span>
            </div>
          </a>
        </article>`;
    }

    function render() {
      const q = searchQuery.toLowerCase().trim();
      const filtered = PRODUCTS.filter(p => {
        const matchCat   = activeCategory === "all" || p.category === activeCategory;
        const matchQuery = !q || p.name.toLowerCase().includes(q);
        return matchCat && matchQuery;
      }).sort((a, b) => a.name.localeCompare(b.name));
      const grid    = document.getElementById("grid");
      const empty   = document.getElementById("empty");
      const lmWrap  = document.getElementById("load-more-wrap");
      const toShow  = filtered.slice(0, visibleCount);
      document.getElementById("result-count").textContent =
        filtered.length === 0 ? "" :
        filtered.length === 1 ? "1 product" :
        `${filtered.length} products`;
      grid.innerHTML = toShow.map(cardHTML).join("");
      empty.style.display  = filtered.length === 0 ? "block" : "none";
      lmWrap.style.display = toShow.length < filtered.length ? "flex" : "none";
      attachVideoLazy(grid);
    }

    function loadMore() {
      visibleCount += PAGE_SIZE;
      render();
    }

    function renderNovidades() {
      const recentes = [...PRODUCTS]
        .filter(p => p.date)
        .sort((a, b) => new Date(b.date) - new Date(a.date))
        .slice(0, 5);
      const section  = document.getElementById("novidades-section");
      const strip    = document.getElementById("novidades-strip");
      if (recentes.length === 0) return;
      strip.innerHTML = recentes.map(cardHTML).join("");
      section.style.display = "block";
      attachVideoLazy(strip);
    }

    function markLoaded(el) {
      el.classList.add('loaded');
      el.closest('.card-media')?.classList.add('media-loaded');
    }

    function attachVideoLazy(container) {
      container.querySelectorAll('img.media-img').forEach(img => {
        if (img.complete && img.naturalWidth > 0) {
          markLoaded(img);
        } else {
          img.addEventListener('load',  () => markLoaded(img), { once: true });
          img.addEventListener('error', () => img.closest('.card-media')?.classList.add('media-loaded'), { once: true });
        }
      });
    }

    function openVideoModal(event, videoSrc, posterSrc) {
      event.preventDefault();
      event.stopPropagation();
      const overlay = document.getElementById('video-modal-overlay');
      const video   = document.getElementById('video-modal-player');
      const spinner = document.getElementById('video-modal-spinner');
      if (posterSrc) video.poster = posterSrc;
      spinner.style.display = 'block';
      video.addEventListener('canplay', () => { spinner.style.display = 'none'; }, { once: true });
      video.src = videoSrc;
      overlay.classList.add('open');
      document.body.style.overflow = 'hidden';
      video.play().catch(() => {});
    }

    function closeVideoModal(e) {
      if (e && e.target !== document.getElementById('video-modal-overlay') &&
          !e.target.closest('.modal-close')) return;
      const overlay = document.getElementById('video-modal-overlay');
      const video   = document.getElementById('video-modal-player');
      const spinner = document.getElementById('video-modal-spinner');
      spinner.style.display = 'none';
      video.pause();
      video.removeAttribute('poster');
      video.removeAttribute('src');
      video.load();
      overlay.classList.remove('open');
      document.body.style.overflow = '';
    }

    (function initTheme() {
      const root  = document.documentElement;
      const btn   = document.getElementById("theme-toggle");
      const saved = localStorage.getItem("theme") || "light";
      root.setAttribute("data-theme", saved);
      btn.textContent = saved === "dark" ? "☀️" : "🌙";
      btn.addEventListener("click", () => {
        const next = root.getAttribute("data-theme") === "dark" ? "light" : "dark";
        root.setAttribute("data-theme", next);
        localStorage.setItem("theme", next);
        btn.textContent = next === "dark" ? "☀️" : "🌙";
      });
    })();

    document.getElementById("search").addEventListener("input", e => {
      searchQuery = e.target.value;
      visibleCount = PAGE_SIZE;
      render();
    });

    function openModal(p) {
      const overlay = document.getElementById('modal-overlay');
      const titleEl = document.getElementById('modal-title');
      const prodsEl = document.getElementById('modal-products');
      const related = Array.isArray(p.related_products) ? p.related_products : [];

      titleEl.textContent = p.name;
      prodsEl.innerHTML = related.map(rp =>
        `<a href="${esc(rp.link)}" class="card-cta-multi"
            target="_blank" rel="noopener noreferrer sponsored">
          ${esc(rp.label || 'Get link →')}
        </a>`
      ).join('');

      overlay.classList.add('open');
      document.body.style.overflow = 'hidden';
    }

    function closeModal(e) {
      if (e && e.target !== document.getElementById('modal-overlay') &&
          !e.target.closest('.modal-close')) return;
      document.getElementById('modal-overlay').classList.remove('open');
      document.body.style.overflow = '';
    }

    document.addEventListener('keydown', e => {
      if (e.key !== 'Escape') return;
      closeModal();
      closeVideoModal();
    });

    fetch('products.json?v=' + Date.now())
      .then(r => r.json())
      .then(data => { PRODUCTS.push(...data); })
      .catch(() => {})
      .finally(() => { buildCategories(); renderNovidades(); render(); });
  </script>
  <!-- Modal popup para cards com múltiplos produtos -->
  <div id="modal-overlay" onclick="closeModal(event)" role="dialog" aria-modal="true">
    <div class="modal-box">
      <button class="modal-close" onclick="closeModal()" aria-label="Close">✕</button>
      <div class="modal-body">
        <h3 class="modal-title" id="modal-title"></h3>
        <p class="modal-label">Shop items in this video</p>
        <div class="modal-products" id="modal-products"></div>
      </div>
    </div>
  </div>

  <!-- Video popup -->
  <div id="video-modal-overlay" onclick="closeVideoModal(event)" role="dialog" aria-modal="true">
    <div class="video-modal-box">
      <button class="modal-close" onclick="closeVideoModal()" aria-label="Close">✕</button>
      <div id="video-modal-spinner" class="video-modal-spinner" aria-hidden="true"></div>
      <video id="video-modal-player" controls autoplay loop playsinline></video>
    </div>
  </div>

</body>
</html>
